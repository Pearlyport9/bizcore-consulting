backend:
  name: github
  repo: Pearlyport9/bizcore-consulting
  branch: main
  base_url: https://unique-cupcake-03e19c.netlify.app
  auth_endpoint: auth
# Where uploaded media (images) get stored in the repo
media_folder: "public/assets/blog-images"
# Public URL path for images (what gets used in markdown)
public_folder: "/assets/blog-images"
# Site URL for previews
site_url: https://bizcore-consulting.vercel.app
display_url: https://bizcore-consulting.vercel.app
logo_url: https://bizcore-consulting.vercel.app/og-image.png
# Content collections
collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sort: "date:desc"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly version of the title, e.g. '5-financial-models-every-sme-should-know'" }
      - { label: "Publish Date", name: "date", widget: "datetime", default: "" }
      - { label: "Author", name: "author", widget: "string", default: "BIZCORE Team" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on blog listing page (1-2 sentences)" }
      - { label: "Cover Image", name: "cover_image", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Finance", "Strategy", "Data & Analytics", "Market Research", "Startups", "SME Tips"] }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Comma-separated tags" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }

backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/images/blog"
public_folder: "/src/assets/images/blog"

publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Post"
    folder: "content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    format: "json-frontmatter"
    preview_path: "blog-post.html?id={{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "BIZCORE Team" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "Financial Planning",
              "Market Research",
              "Data Analytics",
              "Investment",
              "Business Strategy",
            ],
        }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | BIZCORE Consulting</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0D1B2A;
    --gold: #C9A84C;
    --gold-hover: #b8962e;
    --off-white: #F8F8F6;
    --text: #1a1a2e;
    --muted: #6b7280;
    --success: #10b981;
    --error: #ef4444;
    --border: #e5e7eb;
    --radius: 10px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--text);
    min-height: 100vh;
  }
  h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
  .header {
    background: var(--navy);
    color: white;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .header .subtitle { color: rgba(255,255,255,0.6); font-size: 13px; }
  .header .actions { display: flex; gap: 12px; align-items: center; }
  .header a { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; transition: color 0.2s; }
  .header a:hover { color: var(--gold); }
  .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
  .btn-logout:hover { border-color: var(--error); color: var(--error); }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: white;
    border-radius: var(--radius);
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .login-card h1 { font-size: 24px; color: var(--navy); margin-bottom: 4px; }
  .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; font-family: inherit; }
  .login-card input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
  .login-error { color: var(--error); font-size: 13px; margin-bottom: 12px; display: none; }
  .btn-primary {
    background: var(--gold);
    color: var(--navy);
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .btn-primary:hover { background: var(--gold-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: white;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-secondary:hover { background: #f3f4f6; }
  .btn-danger {
    background: var(--error);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: inherit;
  }
  .btn-danger:hover { opacity: 0.9; }
  .dashboard { display: none; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .stat-card .num { font-size: 28px; font-weight: 700; font-family: 'Outfit', sans-serif; }
  .stat-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-top: 4px; }
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .toolbar input {
    flex: 1;
    min-width: 200px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .toolbar input:focus { border-color: var(--gold); }
  .post-table {
    background: white;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .post-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .post-table th {
    background: #f9fafb;
    text-align: left;
    padding: 12px 16px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .post-table td { padding: 12px 16px; border-top: 1px solid var(--border); }
  .post-table tr:hover td { background: #fafaf8; }
  .post-table .actions { display: flex; gap: 8px; }
  .post-table .actions button {
    background: none;
    border: none;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .post-table .actions .edit-btn { color: var(--gold); }
  .post-table .actions .edit-btn:hover { background: rgba(201,168,76,0.1); }
  .post-table .actions .del-btn { color: var(--error); }
  .post-table .actions .del-btn:hover { background: rgba(239,68,68,0.1); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge-yes { background: #d1fae5; color: #065f46; }
  .badge-no { background: #f3f4f6; color: var(--muted); }
  .empty-state { padding: 48px 24px; text-align: center; color: var(--muted); }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
    overflow-y: auto;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 700px;
    position: relative;
    margin-top: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 24px;
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }
  .modal-close:hover { background: #f3f4f6; }
  .modal h2 { font-size: 22px; color: var(--navy); margin-bottom: 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; font-family: 'Outfit', sans-serif; }
  .form-group label .hint { font-weight: 400; color: var(--muted); font-size: 11px; font-family: 'DM Sans', sans-serif; }
  .form-group input, .form-group select, .form-group textarea, .body-field {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus, .body-field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.1); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .editor-toolbar button {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    font-family: inherit;
  }
  .editor-toolbar button:hover {
    border-color: var(--gold);
    background: #fff8e7;
  }
  .editor-body {
    min-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .editor-body[contenteditable="true"] {
    outline: none;
  }
  .hidden { display: none !important; }
  .form-group .body-field { min-height: 200px; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .form-group .checkbox-label input { width: auto; }
  .modal-footer {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 24px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    animation: slideUp 0.3s ease;
  }
  .toast.show { display: block; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--error); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .hidden { display: none !important; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(250,250,250,0.6));
    color: var(--muted);
    margin-bottom: 8px;
  }
  .dropzone.dragover { border-color: var(--gold); box-shadow: 0 6px 20px rgba(201,168,76,0.08); }
  .dropzone input[type=file] { display: none; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .container { padding: 16px 12px; }
    .modal { padding: 20px; }
    .header { padding: 12px 16px; }
  }
</style>
</head>
<body>

  <div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p>BIZCORE Consulting</p>
    <input type="email" id="emailInput" placeholder="Email" autocomplete="email" />
    <input type="password" id="passwordInput" placeholder="Password" autocomplete="off" />
    <p class="login-error" id="loginError">Invalid credentials</p>
    <button class="btn-primary" id="loginBtn" style="width:100%">Sign In</button>
  </div>
</div>

<div class="dashboard" id="dashboard">
  <div class="header">
    <div><h1>BIZCORE <span class="subtitle">| Admin Panel</span></h1></div>
    <div class="actions">
      <a href="/" target="_blank">View Site →</a>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="container">
    <div class="stats">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">Total Posts</div></div>
      <div class="stat-card"><div class="num" id="statFeatured" style="color:var(--gold)">0</div><div class="label">Featured</div></div>
      <div class="stat-card"><div class="num" id="statDrafts" style="color:var(--muted)">0</div><div class="label">Drafts</div></div>
    </div>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by title..." />
      <button class="btn-primary" id="newPostBtn">+ New Post</button>
    </div>
    <div class="post-table">
      <table>
        <thead><tr>
          <th>Title</th>
          <th style="width:130px">Category</th>
          <th style="width:110px">Date</th>
          <th style="width:80px">Featured</th>
          <th style="width:140px">Actions</th>
        </tr></thead>
        <tbody id="postsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editorOverlay">
  <div class="modal">
    <button class="modal-close" id="closeEditor">&times;</button>
    <h2 id="editorTitle">New Post</h2>
    <form id="postForm">
      <input type="hidden" id="editOriginalFile" />
      <div class="form-row">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="postTitle" required />
        </div>
        <div class="form-group">
          <label>Slug <span class="hint">(auto-generated from title)</span></label>
          <input type="text" id="postSlug" required placeholder="e.g. my-post-title" />
        </div>
      </div>
      <div class="form-group">
        <label>Excerpt <span class="hint">(1-2 sentences)</span></label>
        <textarea id="postExcerpt" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="postCategory">
            <option value="">Select...</option>
            <option>Finance</option>
            <option>Strategy</option>
            <option>Data & Analytics</option>
            <option>Market Research</option>
            <option>Startups</option>
            <option>SME Tips</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tags <span class="hint">(comma-separated)</span></label>
          <input type="text" id="postTags" placeholder="e.g. finance, sme, growth" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cover Image URL</label>
          <div class="dropzone" id="coverDropzone">
            <input type="file" id="postCoverFile" accept="image/*" />
            <div class="dz-content">Drag &amp; drop an image here, or click to browse</div>
          </div>
          <input type="text" id="postCover" placeholder="/assets/blog-images/... or uploaded image URL" />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="datetime-local" id="postDate" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Author</label>
          <input type="text" id="postAuthor" value="BIZCORE Team" />
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="postFeatured" />
            Featured post
          </label>
        </div>
      </div>
      <input type="hidden" id="postId" />
      <div class="form-group">
        <label>Body <span class="hint">(rich text supported)</span></label>
        <div class="editor-toolbar" id="editorToolbar">
          <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
          <button type="button" data-command="italic" title="Italic"><em>I</em></button>
          <button type="button" data-command="underline" title="Underline"><u>U</u></button>
          <button type="button" data-command="insertOrderedList" title="Numbered list">1.</button>
          <button type="button" data-command="insertUnorderedList" title="Bulleted list">•</button>
          <button type="button" data-command="createLink" title="Insert link">Link</button>
          <button type="button" data-command="formatBlock" data-value="h2" title="Heading">H2</button>
        </div>
        <div id="postBodyEditor" class="body-field editor-body" contenteditable="true" placeholder="Write your post content here..."></div>
        <textarea id="postBody" class="hidden"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelEditor">Cancel</button>
        <button type="button" class="btn-danger hidden" id="deletePostBtn">Delete</button>
        <button type="submit" class="btn-primary" id="savePostBtn">Save Post</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./auth.js"></script>
</body>
</html>
